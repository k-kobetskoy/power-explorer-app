name: CI

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The Electron binary is not needed to compile or lint.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build renderer
        run: npx ng build --configuration development

      - name: Build electron
        run: npm run build:electron

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci
